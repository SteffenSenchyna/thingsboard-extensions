<div [class.dark]="darkMode" class="fm-dashboard">
  <tb-sidebar-layout [open]="sidebarOpen" [width]="300">

    <!-- Sidebar: view switcher + Market → Site filter. -->
    <div sidebar class="fm-sidebar">
      <tb-segmented-control [options]="views" [selected]="view" [showActiveLabel]="true" [fullWidth]="true"
                            tooltipPosition="below"
                            (selectedChange)="selectView($event)"></tb-segmented-control>

      <!-- Access codes: which list (Users | Vehicles) and one market at a time. -->
      <ng-container *ngIf="view === 'codes'; else locationFilter">
        <tb-split-toggle [options]="codeKinds" [selected]="codeKind"
                         (selectedChange)="onCodeKindChange($event)"></tb-split-toggle>
        <tb-filter-list searchPlaceholder="Search" emptyText="No markets" [multiple]="false"
                        [options]="marketOptions" [selected]="codesMarketSelection"
                        (selectedChange)="onCodesMarketChange($event)"></tb-filter-list>
      </ng-container>
      <!-- Pumps / Activity: the Market → Site tree. -->
      <ng-template #locationFilter>
        <tb-filter-list searchPlaceholder="Search" emptyText="No markets"
                        [options]="locationOptions" [selected]="selectedLocations"
                        (selectedChange)="onLocationsChange($event)"></tb-filter-list>
      </ng-template>
    </div>

    <!-- Top bar: sidebar toggle | alarms + theme. -->
    <div class="fm-topbar">
      <tb-header-icon-button [icon]="sidebarOpen ? 'left_panel_close' : 'left_panel_open'"
                             [tooltip]="sidebarOpen ? 'Hide filters' : 'Show filters'"
                             (click)="toggleSidebar()"></tb-header-icon-button>
      <div class="fm-topbar-actions">
        <tb-header-icon-button icon="notifications" tooltip="Alarms" [badge]="panelAlarms.length"
                               [active]="alarmPanelOpen" (click)="alarmPanelOpen = true"></tb-header-icon-button>
        <tb-theme-toggle [dark]="darkMode" (toggled)="toggleTheme()"></tb-theme-toggle>
      </div>
    </div>

    <!-- Pumps -->
    <div *ngIf="view === 'pumps'" class="fm-view">
      <tb-data-table title="Pumps" icon="local_gas_station" [columns]="pumpColumns" [rows]="visiblePumps"
                     [loading]="pumpsLoading" [fillHeight]="true" [rowHeight]="40" trackByKey="pumpId"
                     [selectable]="true" [selectedKey]="highlightedPumpId" (rowClick)="onPumpRowClick($event)"
                     [searchKeys]="['name', 'site', 'market', 'fuelType']" searchPlaceholder="Search pumps"
                     emptyText="No pumps found" emptyIcon="local_gas_station" loadingText="Loading pumps…">
        <ng-template tbDataTableCell="name" let-row>
          <span class="fm-strong">{{ row.name }}</span>
        </ng-template>
        <ng-template tbDataTableCell="site" let-row>
          <span class="fm-muted">{{ row.site || "—" }}</span>
        </ng-template>
        <ng-template tbDataTableCell="fuelType" let-row>
          <span class="fm-muted">{{ row.fuelType || "—" }}</span>
        </ng-template>
        <!-- Codes used / capacity — the icon + used count open the pump panel on its Access codes tab. -->
        <ng-template tbDataTableCell="codeCount" let-row>
          <span class="fm-code-count" [class.fm-has-codes]="row.codeCount > 0">
            <button type="button" class="fm-code-used"
                    [attr.aria-label]="row.codeCount + ' of ' + settings.maxCodesPerPump + ' codes — open access codes'"
                    (click)="onCodesCellClick($event, row)">
              <mat-icon>key</mat-icon>{{ row.codeCount }}
            </button>
            <span class="fm-code-max">/ {{ settings.maxCodesPerPump }}</span>
          </span>
        </ng-template>
        <ng-template tbDataTableCell="status" let-row>
          <tb-status-pill [tone]="statusMeta(row.status).tone" [icon]="statusMeta(row.status).icon">
            {{ statusMeta(row.status).label }}
          </tb-status-pill>
        </ng-template>
        <ng-template tbDataTableCell="lastDispense" let-row>
          <span class="fm-muted">{{ row.lastDispense }}</span>
        </ng-template>
      </tb-data-table>
    </div>

    <!-- Access codes: the selected market's user / vehicle list. -->
    <div *ngIf="view === 'codes'" class="fm-view">
      <tb-data-table title="Codes" icon="key" [columns]="codeColumns" [rows]="codeRows"
                     [loading]="marketsLoading" [fillHeight]="true" [fixedLayout]="true" [rowHeight]="33" trackByKey="code"
                     [actions]="codeActions" (actionClick)="onCodeAction($event)" [rowHover]="false"
                     [searchKeys]="['code', 'name']" searchPlaceholder="Search codes"
                     emptyText="No codes" emptyIcon="key_off" loadingText="Loading codes…">
        <ng-template tbDataTableCell="name" let-row>
          <span class="fm-strong">{{ row.name }}</span>
        </ng-template>
        <ng-template tbDataTableCell="added" let-row>
          <span class="fm-muted fm-nowrap">{{ row.added }}</span>
        </ng-template>
        <ng-template tbDataTableCell="actions" let-row>
          <button type="button" class="fm-row-action" aria-label="Revoke code" matTooltip="Revoke" [disabled]="saving"
                  (click)="onRevoke(codesMarket, row.source)">
            <mat-icon>link_off</mat-icon>
          </button>
        </ng-template>
      </tb-data-table>
    </div>

    <!-- Activity -->
    <div *ngIf="view === 'activity'" class="fm-view">
      <tb-data-table title="Activity" icon="history" [columns]="activityColumns" [rows]="activityRows"
                     [loading]="activityLoading" [fillHeight]="true" [rowHeight]="40" trackByKey="id"
                     [rowHover]="false" [actions]="activityActions" (actionClick)="onActivityAction($event)"
                     [searchKeys]="['label', 'pump', 'holder', 'code']" searchPlaceholder="Search activity"
                     emptyText="No activity in this period" emptyIcon="history" loadingText="Loading activity…">
        <tb-timeframe-selector dt-header-actions [options]="activityTimeframes" [selected]="activityTimeframe"
                               (selectedChange)="onActivityTimeframe($event)"></tb-timeframe-selector>
        <tb-filter-chips dt-filter-bar class="fm-activity-chips" [options]="activityChips"
                         [selected]="activityFilter" (selectedChange)="onActivityFilter($event)"></tb-filter-chips>

        <ng-template tbDataTableCell="time" let-row>
          <span class="fm-muted fm-nowrap">{{ row.time }}</span>
        </ng-template>
        <ng-template tbDataTableCell="event" let-row>
          <tb-status-pill [tone]="row.tone" [icon]="row.icon">{{ row.label }}</tb-status-pill>
        </ng-template>
        <ng-template tbDataTableCell="pump" let-row>
          <span class="fm-strong">{{ row.pump }}</span>
        </ng-template>
        <ng-template tbDataTableCell="code" let-row>
          <tb-copy-box *ngIf="row.code; else noCode" [value]="row.code"></tb-copy-box>
          <ng-template #noCode><span class="fm-muted">—</span></ng-template>
        </ng-template>
        <ng-template tbDataTableCell="volume" let-row>
          <span class="fm-muted fm-num">{{ row.volume }}</span>
        </ng-template>
      </tb-data-table>
    </div>
  </tb-sidebar-layout>

  <!-- Pump detail panel (opens from a Pumps row). -->
  <tb-entity-detail-panel #pumpPanel [open]="detailOpen" icon="local_gas_station" [name]="selectedPump?.name || ''"
                          [subtitle]="pumpSubtitle" [tabs]="detailTabs" [initialTab]="detailOpenTab"
                          (activeTabChange)="detailTab = $event" (closed)="closeDetail()">
    <tb-status-pill header-actions *ngIf="selectedPump" size="md" [tone]="statusMeta(selectedPump.status).tone"
                    [icon]="statusMeta(selectedPump.status).icon">{{ statusMeta(selectedPump.status).label }}</tb-status-pill>

    <div insights *ngIf="selectedPump" class="fm-insights">
      <tb-metric-chart-card [ctx]="ctx" [deviceId]="selectedPump.pumpId" title="Dispensing" [dark]="darkMode"
                            [(timeframe)]="insightsTimeframe" [charts]="metricsCharts"></tb-metric-chart-card>
    </div>

    <tb-fuel-pump-access-codes tab-content *ngIf="selectedPump" [market]="marketOf(selectedPump)" [kind]="codeKind"
                               [saving]="saving" [maxCodes]="settings.maxCodesPerPump"
                               (kindChange)="onCodeKindChange($event)"
                               (revoke)="onRevoke(marketOf(selectedPump), $event)"
                               (assign)="openAssign(marketOf(selectedPump), true)"></tb-fuel-pump-access-codes>

    <!-- Slot wrapper: the list's own "alarms" input shares the slot attribute's name. -->
    <div alarms>
      <tb-alarm-list [alarms]="detailAlarms" [loading]="alarmsLoading" (clear)="clearAlarm($event)"></tb-alarm-list>
    </div>

    <tb-device-settings-card settings *ngIf="selectedPump" [ctx]="ctx" [deviceId]="selectedPump.pumpId"
                             [hostname]="selectedPump.deviceName" [label]="selectedPump.deviceLabel"
                             [description]="selectedPump.description" [deviceType]="selectedPump.type"
                             attributeCardTitle="Pump details" [attributeSelects]="fuelTypeSelects"
                             [attributeValues]="fuelTypeValues" deviceSettingsTitle="Access control"
                             [deviceSettings]="lockControls" [deviceSettingsValues]="lockValues"
                             (saved)="loadPumps()"></tb-device-settings-card>
  </tb-entity-detail-panel>

  <!-- Alarms panel (header bell) — one card per pump. -->
  <tb-entity-detail-panel [open]="alarmPanelOpen" icon="notifications" name="Alarms"
                          [tabs]="alarmPanelTabs" [dismissible]="true" [flushBody]="true"
                          (closed)="alarmPanelOpen = false">
    <div alarms>
      <tb-alarm-list [alarms]="panelAlarms" [grouped]="true" [loading]="alarmsLoading"
                     (clear)="clearAlarm($event)"></tb-alarm-list>
    </div>
  </tb-entity-detail-panel>

  <!-- Assign-code panel (from a pump's Codes tab or the codes table's +) — adds to that market. -->
  <tb-entity-detail-panel [open]="assignOpen" icon="key" name="Assign access code" [subtitle]="assignSubtitle"
                          [tabs]="assignTabs" [dismissible]="true" (closed)="closeAssign()">
    <tb-fuel-assign-code-form tab-content [kind]="assignKind" [takenCodes]="takenCodes" [resetKey]="assignResetKey"
                              [saving]="saving" [full]="assignFull" [maxCodes]="settings.maxCodesPerPump"
                              (submitted)="onAssign($event)" (cancelled)="closeAssign()"></tb-fuel-assign-code-form>
  </tb-entity-detail-panel>

  <!-- Revoke confirmation — themed with the dashboard (light / dark). -->
  <tb-ext-confirm-dialog [open]="!!revokeConfirm" heading="Revoke access code?" [message]="revokeConfirm?.message || ''"
                     confirmLabel="Revoke" [danger]="true"
                     (confirmed)="confirmRevoke()" (cancelled)="cancelRevoke()"></tb-ext-confirm-dialog>
</div>
