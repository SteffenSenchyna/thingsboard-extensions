<form class="icf" [formGroup]="form" (ngSubmit)="submit()">
  <!-- Their plants (the plant tree, as the create form's) and the pasted list in one card. -->
  <tb-card>
    <div class="icf-fields">
      <!-- Where they work: a market whose every plant is ticked takes them in its own list (its sites to come too), any other plant its own. -->
      <div class="icf-field">
        <span class="icf-label">Plants</span>
        <tb-filter-list searchPlaceholder="Search" emptyText="No plants" [treeToggle]="true" [field]="true" [options]="plantOptions" [selected]="plants"
                        (selectedChange)="setPlants($event)"></tb-filter-list>
        <span class="icf-hint">{{ plantsText }}</span>
      </div>

      <div class="icf-field">
        <!-- Its format in the info bubble beside the label, not under the field. -->
        <label class="icf-label" for="icf-text">Codes<span class="icf-info" tabindex="0" role="img" [attr.aria-label]="formatNote" [tbTip]="formatNote"><mat-icon>info</mat-icon></span></label>
        <textarea id="icf-text" class="icf-input icf-text" formControlName="text" rows="8" spellcheck="false"
                  autocomplete="off" (input)="onTextInput()" (paste)="onTextPaste()"></textarea>
      </div>
    </div>
  </tb-card>

  <!-- How many lines the scope has no room for (they're skipped). -->
  <tb-callout *ngIf="limitReason" type="warning" title="No room left">{{ limitReason }}</tb-callout>

  <!-- Preview: every line as it will be imported — a panel's list, grouped by what becomes of it ("Ready (12)", "Already in use (2)", + / −). -->
  <tb-detail-table title="Preview" [columns]="previewColumns" [rows]="previewRows" groupKey="status" emptyText="No codes pasted"
                   emptyIcon="upload_file" [resetKey]="resetKey"></tb-detail-table>

  <!-- The pick's stations: whether each can take new codes of the lists in the paste now. -->
  <tb-fuel-station-readiness [plcs]="plcs" [loading]="plcsLoading" [kinds]="importKinds"></tb-fuel-station-readiness>

  <!-- The form's buttons (the shared ones). -->
  <tb-form-actions [submitLabel]="submitLabel" [disabled]="!canSubmit" (cancelled)="cancelled.emit()"></tb-form-actions>
</form>
