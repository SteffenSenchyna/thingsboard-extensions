<!-- Require-code switch (SHARED attribute on the pump). -->
<tb-card>
  <div class="pac-require-head">
    <span class="pac-title">Require access code</span>
    <tb-ext-switch [ngModel]="pump.requireCode" (ngModelChange)="requireCodeChange.emit($event)"
                   [disabled]="saving"></tb-ext-switch>
  </div>
  <p class="pac-hint">Pump only dispenses after a valid code is entered at the keypad.</p>
</tb-card>

<tb-data-table title="Assigned codes" [compactHeader]="true" [columns]="columns" [rows]="rows"
               [showColumnHeaders]="false" [searchEnabled]="false" [paginated]="false" trackByKey="code"
               [insetRowDivider]="true" [rowHover]="false" emptyText="No codes assigned" emptyIcon="key_off">
  <ng-template tbDataTableCell="code" let-row>
    <div class="pac-row">
      <tb-copy-box [value]="row.code"></tb-copy-box>
      <div class="pac-holder">
        <div class="pac-name">{{ row.holder }}</div>
        <div class="pac-meta">{{ row.meta }}</div>
      </div>
      <button type="button" class="pac-revoke" aria-label="Revoke code" matTooltip="Revoke" [disabled]="saving"
              (click)="revoke.emit(row.source)">
        <mat-icon>link_off</mat-icon>
      </button>
    </div>
  </ng-template>
</tb-data-table>

<div class="pac-actions">
  <button type="button" class="pac-assign" [disabled]="saving" (click)="assign.emit()">Assign code</button>
</div>
