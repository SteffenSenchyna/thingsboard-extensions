<tb-split-toggle [options]="kinds" [selected]="kind" (selectedChange)="kindChange.emit($any($event))"></tb-split-toggle>

<!-- Read-only: the codes sent to the pump (shared), the same lists the sync pill checks. -->
<tb-data-table title="Codes" [compactHeader]="true" [columns]="columns" [rows]="rows"
               [showColumnHeaders]="false" [searchEnabled]="false" [paginated]="false" trackByKey="slot"
               [insetRowDivider]="true" [rowHover]="false" emptyText="No codes on this pump" emptyIcon="key_off">
  <!-- Synced once the pump reports (client) the code lists it was sent (shared); Desynced (warning) while they differ. -->
  <tb-status-pill dt-header-actions *ngIf="sync" [tone]="sync === 'synced' ? 'success' : 'warning'"
                  [matTooltip]="sync === 'synced' ? 'The pump has confirmed its codes' : 'The codes on the pump differ from what it was sent'">
    {{ sync === "synced" ? "Synced" : "Desynced" }}
  </tb-status-pill>
  <ng-template tbDataTableCell="code" let-row>
    <div class="pac-row">
      <tb-copy-box [value]="row.code"></tb-copy-box>
      <div class="pac-name" [class.unknown]="!row.holder">{{ row.holder || "Unknown holder" }}</div>
    </div>
  </ng-template>
</tb-data-table>

<div *ngIf="slotCount" class="pac-footer">{{ rows.length }} / {{ slotCount }} slots used</div>
