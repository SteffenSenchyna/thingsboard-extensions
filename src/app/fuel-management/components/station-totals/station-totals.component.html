<!-- Its own window picker (the station's cards keep one window — each bound two-way to it), the window's figures, then its bars by the
     hour or the day (a pump a segment, or the denials on the dispenses). -->
<tb-collapsible-card [title]="title" [info]="info">
  <tb-timeframe-picker class="fst-tf" [selected]="timeframe" (selectedChange)="pick($event)"></tb-timeframe-picker>
  <tb-stat-grid [wireframe]="figuresLoading" [items]="stats"></tb-stat-grid>
  <tb-bar-chart class="fst-chart" [categories]="categories" [series]="series" [stacked]="true" [unit]="unit" [decimals]="decimals"
                height="200px" [dark]="dark" [loading]="!buckets" emptyText="No dispenses in this period"></tb-bar-chart>
</tb-collapsible-card>
