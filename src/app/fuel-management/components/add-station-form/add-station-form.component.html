<!-- A new station: its plant and number in one card, then its pumps (a section each, as the station panel's Pumps card), then the
     form's buttons — the shared setting pieces, as every settings card. -->
<form class="asf" [formGroup]="form" (ngSubmit)="submit()">
  <tb-card>
    <tb-setting-stack>
      <tb-setting-field label="Plant">
        <tb-select [searchable]="true" emptyText="No plants" [options]="plantOptions" formControlName="site"></tb-select>
      </tb-setting-field>
      <tb-setting-field label="Station number" inputId="asf-number" [error]="numberError(form.controls['number'], stationName)">
        <input id="asf-number" type="text" formControlName="number" inputmode="numeric" maxlength="3" autocomplete="off"
               (input)="digitsOnly(form.controls['number'])" />
      </tb-setting-field>
      <!-- The name it makes (the gateway's connector sends its data under it), or why it can't be named. -->
      <tb-setting-note *ngIf="stationName">Creates {{ stationName }}, shown as {{ stationLabel }}.</tb-setting-note>
      <tb-setting-note *ngIf="plant && !prefix">This plant has no product line, so its devices can't be named.</tb-setting-note>
    </tb-setting-stack>
  </tb-card>

  <!-- Its pumps: a section each — its number and fuel type, the name it makes — "Create new" adding the next. -->
  <tb-collapsible-card title="Pumps" [collapsible]="false">
    <tb-setting-stack formArrayName="pumps">
      <ng-container *ngFor="let g of pumps.controls; let i = index; let first = first; trackBy: trackIndex">
        <tb-setting-divider *ngIf="!first"></tb-setting-divider>
        <tb-setting-section [formGroupName]="i" [heading]="'Pump ' + (i + 1)">
          <button section-action type="button" class="asf-link" [disabled]="saving" (click)="removePump(i)">Remove</button>
          <tb-setting-field label="Pump number" [inputId]="'asf-pump-' + i" [error]="numberError($any(g).controls['number'], pumpName(g))">
            <input [id]="'asf-pump-' + i" type="text" formControlName="number" inputmode="numeric" maxlength="3" autocomplete="off"
                   (input)="digitsOnly($any(g).controls['number'])" />
          </tb-setting-field>
          <tb-setting-field label="Fuel type">
            <tb-select [options]="fuelTypeOptions" formControlName="fuelType"></tb-select>
          </tb-setting-field>
          <tb-setting-note *ngIf="pumpName(g)">Creates {{ pumpName(g) }}, shown as {{ pumpLabel(g) }}.</tb-setting-note>
        </tb-setting-section>
      </ng-container>
      <tb-setting-note *ngIf="!pumps.length" icon="">No pumps on this station</tb-setting-note>
      <button type="button" class="asf-link asf-add" [disabled]="saving" (click)="addPump()">Create new</button>
    </tb-setting-stack>
  </tb-collapsible-card>

  <!-- The form's buttons (the shared ones). -->
  <tb-form-actions [submitLabel]="saving ? 'Creating…' : 'Create station'" [disabled]="!canSubmit" (cancelled)="cancelled.emit()"></tb-form-actions>
</form>
