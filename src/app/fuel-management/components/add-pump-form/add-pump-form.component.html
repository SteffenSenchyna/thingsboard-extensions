<!-- A section of the station's Pumps card (as its pumps), of the shared setting pieces: heading, its number and fuel type, the
     name it makes, then its own Create / Cancel. -->
<form [formGroup]="form" (ngSubmit)="submit()">
  <tb-setting-section heading="New pump">
    <ng-container *ngIf="prefix; else noPrefix">
      <tb-setting-field label="Pump number" inputId="apf-number" [error]="numberError">
        <input #numberInput id="apf-number" type="text" formControlName="number" inputmode="numeric" maxlength="3" autocomplete="off"
               placeholder="e.g. 3" (input)="digitsOnly()" />
      </tb-setting-field>

      <tb-setting-field label="Fuel type">
        <tb-select [options]="fuelTypeOptions" formControlName="fuelType"></tb-select>
      </tb-setting-field>

      <tb-setting-note *ngIf="deviceName">Creates {{ deviceName }}, shown as {{ pumpLabel }}.</tb-setting-note>
    </ng-container>
    <ng-template #noPrefix>
      <tb-setting-note>This station's name doesn't follow product-site-plc-#, so its pumps can't be named.</tb-setting-note>
    </ng-template>

    <div class="apf-actions">
      <button type="submit" class="apf-submit" [disabled]="!canSubmit">{{ saving ? "Creating…" : "Create" }}</button>
      <button type="button" class="apf-cancel" [disabled]="saving" (click)="cancelled.emit()">Cancel</button>
    </div>
  </tb-setting-section>
</form>
