<!-- A block a pump (the shared tb-detail-block, a rule between two): its name, fuel type and state, then its facts. Nothing opens:
     the station manages them. -->
<tb-collapsible-card title="Pumps" [collapsible]="false">
  <div *ngIf="!views.length" class="sp-empty">No pumps on this station</div>
  <tb-detail-block *ngFor="let p of views; trackBy: trackId" [heading]="p.name" [note]="p.fuelType">
    <tb-status-pill block-actions [tone]="p.state.tone" [icon]="p.state.icon">{{ p.state.label }}</tb-status-pill>
    <!-- Its fuel today, this month and this year (the backend's totals) against its limits — a pill once near, over or well over. -->
    <tb-detail-row *ngFor="let u of p.use; trackBy: trackPeriod" [label]="u.label">
      <span class="sp-value">
        <span>{{ u.text }}</span>
        <tb-status-pill *ngIf="u.band as b" [tone]="b.tone">{{ b.label }}</tb-status-pill>
      </span>
    </tb-detail-row>
    <tb-detail-row label="Dispenses today">{{ p.dispenses }}</tb-detail-row>
    <tb-detail-row label="Last dispense">{{ p.lastDispense }}</tb-detail-row>
    <tb-detail-row label="Overload trip">
      <ng-container *ngTemplateOutlet="fact; context: { $implicit: p.overload }"></ng-container>
    </tb-detail-row>
    <tb-detail-row label="Event buffer">
      <ng-container *ngTemplateOutlet="fact; context: { $implicit: p.buffer }"></ng-container>
    </tb-detail-row>
    <tb-detail-row label="Last report">{{ p.lastReport }}</tb-detail-row>
  </tb-detail-block>
</tb-collapsible-card>

<!-- A fact: a pill in its tone (an OK flag green), or plain text when it has none (not reported). -->
<ng-template #fact let-f>
  <tb-status-pill *ngIf="f.tone; else plain" [tone]="f.tone">{{ f.text }}</tb-status-pill>
  <ng-template #plain>{{ f.text }}</ng-template>
</ng-template>
