<form class="acf" [formGroup]="form" (ngSubmit)="submit()">
  <!-- Market + scope + holder + code in one card (the list is the Codes tab it was opened from). -->
  <tb-card>
    <div class="acf-fields">
      <div class="acf-field">
        <span class="acf-label">Market</span>
        <tb-select [options]="marketOptions" formControlName="market"></tb-select>
      </div>

      <!-- Its scope: every site of the market (their stations all get it), or one site's stations only. -->
      <div class="acf-field">
        <span class="acf-label">Sites</span>
        <tb-select [options]="siteOptions" formControlName="site"></tb-select>
      </div>

      <div class="acf-field">
        <label class="acf-label" for="acf-name">{{ nameLabel }}</label>
        <input id="acf-name" class="acf-input" [class.invalid]="!!nameError" type="text" formControlName="name" autocomplete="off" />
        <span *ngIf="nameError" class="acf-hint acf-error">{{ nameError }}</span>
      </div>

      <div class="acf-field">
        <!-- Its note in the info bubble beside the label, not under the field. -->
        <label class="acf-label" for="acf-code">Code<span class="acf-info" tabindex="0" role="img" [attr.aria-label]="codeNote" [tbTip]="codeNote"><mat-icon>info</mat-icon></span></label>
        <div class="acf-code-row">
          <input id="acf-code" class="acf-input acf-code" [class.invalid]="!!codeError" type="text" formControlName="code"
                 inputmode="numeric" maxlength="6" autocomplete="off" (input)="digitsOnly()" />
          <button type="button" class="acf-icon-btn" aria-label="Generate" tbTip="Generate" (click)="generate()">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
        <span *ngIf="codeError" class="acf-hint acf-error">{{ codeError }}</span>
      </div>
    </div>
  </tb-card>

  <!-- Why the scope takes no more codes of the list (submitting waits for room). -->
  <tb-callout *ngIf="limitReason" type="warning" title="No room left">{{ limitReason }}</tb-callout>

  <!-- The scope's stations: whether each can take a new code of the selected list now. -->
  <tb-fuel-station-readiness [plcs]="plcs" [loading]="plcsLoading" [kinds]="selectedKinds"></tb-fuel-station-readiness>

  <!-- The form's buttons (the shared ones). -->
  <tb-form-actions [submitLabel]="saving ? 'Saving…' : 'Create code'" [disabled]="!canSubmit" (cancelled)="cancelled.emit()"></tb-form-actions>
</form>
