<form class="acf" [formGroup]="form" (ngSubmit)="submit()">
  <tb-split-toggle [options]="kinds" [selected]="selectedKind" (selectedChange)="setKind($event)"></tb-split-toggle>

  <!-- Holder + code, grouped in a card like the device settings fields. -->
  <tb-card>
    <div class="acf-fields">
      <div class="acf-field">
        <label class="acf-label" for="acf-name">{{ nameLabel }}</label>
        <input id="acf-name" class="acf-input" type="text" formControlName="name" autocomplete="off"
               [placeholder]="namePlaceholder" />
      </div>

      <div class="acf-field">
        <label class="acf-label" for="acf-code">Access code</label>
        <div class="acf-code-row">
          <input id="acf-code" class="acf-input acf-code" [class.invalid]="!!codeError" type="text" formControlName="code"
                 inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Type a code or generate one"
                 (input)="digitsOnly()" />
          <button type="button" class="acf-icon-btn" aria-label="Generate a code" matTooltip="Generate a code"
                  (click)="generate()">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
        <span *ngIf="codeError; else codeHint" class="acf-hint acf-error">{{ codeError }}</span>
        <ng-template #codeHint>
          <span class="acf-hint">6 digits, entered on the pump keypad.</span>
        </ng-template>
      </div>
    </div>
  </tb-card>

  <span *ngIf="limitReason" class="acf-hint acf-full">{{ limitReason }}</span>

  <div class="acf-actions">
    <button type="button" class="acf-cancel" (click)="cancelled.emit()">Cancel</button>
    <button type="submit" class="acf-submit" [disabled]="!canSubmit">{{ saving ? "Assigning…" : "Assign code" }}</button>
  </div>
</form>
