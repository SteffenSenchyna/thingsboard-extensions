<form class="acf" [formGroup]="form" (ngSubmit)="submit()">
  <!-- Its plants (the plant tree a user's form picks with), the holder and the code in one card (the list is the Codes tab it was opened from). -->
  <tb-card>
    <tb-setting-stack>
      <!-- Where it works: a market whose every plant is ticked takes it in its own list (its sites to come too), any other plant its own. -->
      <tb-setting-field label="Plants" [hint]="plantsText">
        <tb-filter-list searchPlaceholder="Search" emptyText="No plants" [treeToggle]="true" [field]="true" [options]="plantOptions" [selected]="plants"
                        (selectedChange)="setPlants($event)"></tb-filter-list>
      </tb-setting-field>

      <tb-setting-field [label]="nameLabel" inputId="acf-name" [error]="nameError">
        <input id="acf-name" type="text" formControlName="name" autocomplete="off" />
      </tb-setting-field>

      <!-- Its note in the info bubble beside the label, not under the field; "Generate" in the field's own box beside it. -->
      <tb-setting-field label="Code" inputId="acf-code" [info]="codeNote" [error]="codeError">
        <div class="acf-code-row">
          <input id="acf-code" class="acf-input acf-code" [class.invalid]="!!codeError" type="text" formControlName="code"
                 inputmode="numeric" maxlength="6" autocomplete="off" (input)="digitsOnly()" />
          <button type="button" class="acf-icon-btn" aria-label="Generate" tbTip="Generate" (click)="generate()">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
      </tb-setting-field>
    </tb-setting-stack>
  </tb-card>

  <!-- Why the scope takes no more codes of the list (submitting waits for room). -->
  <tb-callout *ngIf="limitReason" type="warning" title="No room left">{{ limitReason }}</tb-callout>

  <!-- The scope's stations: whether each can take a new code of the selected list now. -->
  <tb-fuel-station-readiness [plcs]="plcs" [loading]="plcsLoading" [kinds]="selectedKinds"></tb-fuel-station-readiness>

  <!-- The form's buttons (the shared ones). -->
  <tb-form-actions [submitLabel]="saving ? 'Saving…' : 'Create code'" [disabled]="!canSubmit" (cancelled)="cancelled.emit()"></tb-form-actions>
</form>
