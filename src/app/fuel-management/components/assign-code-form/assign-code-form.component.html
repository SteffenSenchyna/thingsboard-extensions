<form class="acf" [formGroup]="form" (ngSubmit)="submit()">
  <tb-split-toggle [options]="kinds" [selected]="selectedKind" (selectedChange)="setKind($event)"></tb-split-toggle>

  <!-- Market + holder + code, grouped in a card like the device settings fields. -->
  <tb-card>
    <div class="acf-fields">
      <div class="acf-field">
        <span class="acf-label">Market</span>
        <tb-select [options]="marketOptions" formControlName="market" placeholder="Select a market"></tb-select>
      </div>

      <div class="acf-field">
        <label class="acf-label" for="acf-name">{{ nameLabel }}</label>
        <input id="acf-name" class="acf-input" type="text" formControlName="name" autocomplete="off"
               [placeholder]="namePlaceholder" />
      </div>

      <div class="acf-field">
        <label class="acf-label" for="acf-code">Access code</label>
        <div class="acf-code-row">
          <input id="acf-code" class="acf-input acf-code" [class.invalid]="!!codeError" type="text" formControlName="code"
                 inputmode="numeric" maxlength="6" autocomplete="off" placeholder="Type a code or generate one"
                 (input)="digitsOnly()" />
          <button type="button" class="acf-icon-btn" aria-label="Generate a code" matTooltip="Generate a code"
                  (click)="generate()">
            <mat-icon>refresh</mat-icon>
          </button>
        </div>
        <span *ngIf="codeError; else codeHint" class="acf-hint acf-error">{{ codeError }}</span>
        <ng-template #codeHint>
          <span class="acf-hint">6 digits, entered on the pump keypad.</span>
        </ng-template>
      </div>
    </div>
  </tb-card>

  <span *ngIf="limitReason" class="acf-hint acf-full">{{ limitReason }}</span>

  <!-- The market's stations (PLCs — they hold the pumps' code tables): each with whether it can take a new code
       of the selected list now. Assigning while one isn't ready asks first (the dashboard's confirm dialog). -->
  <tb-data-table title="Stations" [compactHeader]="true" [columns]="plcColumns" [rows]="plcRows"
                 [loading]="plcsLoading" loadingText="Loading stations…" [showColumnHeaders]="false" [searchEnabled]="false"
                 [paginated]="false" trackByKey="plcId" [insetRowDivider]="true" [rowHover]="false"
                 emptyText="No stations in this market">
    <ng-template tbDataTableCell="name" let-row>
      <div class="acf-plc">
        <span class="acf-plc-name">{{ row.name }}</span>
        <span *ngIf="row.site" class="acf-plc-site">{{ row.site }}</span>
      </div>
    </ng-template>
    <ng-template tbDataTableCell="status" let-row>
      <tb-status-pill [tone]="row.tone" [icon]="row.icon" [matTooltip]="row.hint">{{ row.label }}</tb-status-pill>
    </ng-template>
  </tb-data-table>

  <div class="acf-actions">
    <button type="button" class="acf-cancel" (click)="cancelled.emit()">Cancel</button>
    <button type="submit" class="acf-submit" [disabled]="!canSubmit">{{ saving ? "Assigning…" : "Assign code" }}</button>
  </div>
</form>
