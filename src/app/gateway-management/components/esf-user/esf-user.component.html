<div class="eu">
  <!-- A new user: its name. -->
  <tb-collapsible-card *ngIf="isNew" title="User" [collapsible]="false">
    <div class="eu-fields">
      <div class="eu-field">
        <label class="eu-label" for="esf-user-name">Name</label>
        <input id="esf-user-name" class="eu-input" type="text" autocomplete="off" [class.invalid]="tried && !!nameError" [(ngModel)]="draft.name" />
        <span *ngIf="tried && nameError as e" class="eu-hint eu-error">{{ e }}</span>
      </div>
    </div>
  </tb-collapsible-card>

  <!-- Password, as ESF's: password authentication, a change required at next login, a new password. -->
  <tb-collapsible-card title="Password" [collapsible]="false">
    <div class="eu-fields">
      <tb-ext-checkbox label="Password authentication enabled" [(ngModel)]="draft.passwordAuthEnabled"></tb-ext-checkbox>
      <tb-ext-checkbox label="Require password change at next login" [(ngModel)]="draft.passwordChangeNeeded"></tb-ext-checkbox>
      <div class="eu-field">
        <label class="eu-label" for="esf-user-password">{{ isNew ? "Password" : "New password" }}</label>
        <tb-secret-box inputId="esf-user-password" [placeholder]="isNew ? '' : 'Unchanged'" [(ngModel)]="draft.password"></tb-secret-box>
      </div>
      <div *ngIf="draft.password" class="eu-field">
        <label class="eu-label" for="esf-user-confirm">Confirm password</label>
        <tb-secret-box inputId="esf-user-confirm" [(ngModel)]="draft.confirm"></tb-secret-box>
        <span *ngIf="(tried || draft.confirm) && confirmError as e" class="eu-hint eu-error">{{ e }}</span>
      </div>
    </div>
  </tb-collapsible-card>

  <!-- Permissions, as ESF's: the unit's defined ones, ticked as assigned. -->
  <tb-collapsible-card title="Permissions" [count]="draft.permissions.length" [collapsible]="false">
    <tb-filter-list [options]="permissionOptions" [selected]="draft.permissions" [field]="true" [showCounts]="false" emptyText="No permissions"
                    (selectedChange)="setPermissions($event)"></tb-filter-list>
  </tb-collapsible-card>

  <tb-delete-card *ngIf="!isNew" [disabled]="saving" (delete)="askDelete()"></tb-delete-card>

  <!-- A new user: Cancel / Create from the start; an existing one: Cancel / Apply changes once something changed. -->
  <tb-form-actions *ngIf="isNew || dirty" [submitLabel]="saving ? (isNew ? 'Creating…' : 'Applying…') : isNew ? 'Create' : 'Apply changes'"
                   [disabled]="saving" [cancelDisabled]="saving" [submits]="false" (cancelled)="isNew ? done.emit() : reset()"
                   (submitted)="submit()"></tb-form-actions>
</div>
