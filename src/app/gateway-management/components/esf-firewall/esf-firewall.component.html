<!-- The firewall's rules: one card, its title row's pickers (the timeframe picker's look) choosing the firewall — IPv4 | IPv6 — and its
     rules — Open ports | Port forwarding | NAT — over a table of them (Create new | Manage at its foot); its rows' placeholders while
     the firewall picked is read. -->
<tb-data-table #table [title]="title" [compactHeader]="true" [columns]="columns" [rows]="rows" [wireframe]="loading" [wireframeRowCount]="4"
               trackByKey="key" [searchEnabled]="false" [fitPageSize]="true" [selectable]="true" [selectedKey]="openKey || null" (rowClick)="openRow($event)"
               [multiSelect]="manage.managing"
               (selectionChange)="manage.onSelection($event)" [emptyText]="emptyText" emptyIcon="shield">
  <span dt-header-actions class="fw-pickers">
    <tb-timeframe-picker *ngIf="components.length > 1" [options]="components" [selected]="component"
                         (selectedChange)="componentChange.emit($event)"></tb-timeframe-picker>
    <tb-timeframe-picker *ngIf="options.length" [options]="options" [selected]="section" (selectedChange)="selectSection($event)"></tb-timeframe-picker>
  </span>
  <tb-table-links dt-footer [manage]="manage" [manageDisabled]="loading || !rows.length" [createDisabled]="loading" (create)="startAdd()"
                  (delete)="deleteSelected()"></tb-table-links>
</tb-data-table>
