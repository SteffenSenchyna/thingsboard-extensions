<div class="ev">
  <tb-callout *ngIf="error" type="warning" title="Couldn't read the cloud connections">
    {{ error }} <button type="button" class="ev-link" (click)="load()">Try again</button>
  </tb-callout>
  <!-- As ESF's Cloud Connections page: each connection, then its publishers and subscribers, each marked by its type's icon; a row
       opens its settings (a connection's Connect / Disconnect in its Manage card). -->
  <tb-data-table *ngIf="!error" #table title="Cloud connections" [compactHeader]="true" [columns]="columns" [rows]="rows" [wireframe]="loading && !rows.length"
                 [wireframeRowCount]="4" trackByKey="key" [searchEnabled]="false" [selectable]="true"
                 [selectedKey]="openKey || null" (rowClick)="openRow($any($event))" [multiSelect]="manage.managing"
                 (selectionChange)="manage.onSelection($event)" emptyText="No cloud connections" emptyIcon="cloud">
    <!-- Its factory by name; the PID is the cell's bubble (the column's tooltipOf). -->
    <ng-template tbDataTableCell="factoryPid" let-row>
      <span class="cl-factory-name">{{ factoryName(row.factoryPid) }}</span>
    </ng-template>
    <ng-template tbDataTableCell="status" let-row>
      <tb-status-pill *ngIf="row.status" [tone]="row.status === 'Connected' ? 'success' : 'error'"
                      [icon]="row.status === 'Connected' ? 'cloud_done' : 'cloud_off'">{{ row.status }}</tb-status-pill>
    </ng-template>
    <tb-table-links dt-footer [manage]="manage" [busy]="!!deleting" [deleting]="deleting" [manageDisabled]="!rows.length" [createDisabled]="loading"
                    (create)="openCreate()" (delete)="askDelete()">
      <tb-table-link [disabled]="loading" (action)="load()">Refresh</tb-table-link>
    </tb-table-links>
  </tb-data-table>
</div>
