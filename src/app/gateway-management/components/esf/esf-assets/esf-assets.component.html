<!-- The unit's drivers, each with its assets under it; a row picked shows it under the table (as ESF's page): a driver's settings,
     an asset's Configuration (its channels' grid, its settings) and Data. -->
<div class="ev">
  <tb-callout *ngIf="error" type="warning" title="Couldn't read the drivers and assets">
    {{ error }} <button type="button" class="ev-link" (click)="load()">Try again</button>
  </tb-callout>
  <tb-data-table *ngIf="!error" title="Drivers and assets" [compactHeader]="true" [columns]="columns" [rows]="rows" trackByKey="key" treeParentKey="parent"
                 [fitPageSize]="true"
                 [wireframe]="loading && !rows.length" [wireframeRowCount]="4" [searchEnabled]="false" [selectable]="true" [selectedKey]="openPid || null"
                 (rowClick)="openRow($any($event))" emptyText="No drivers or assets" emptyIcon="settings_input_component"
                 [multiSelect]="manage.managing" (selectionChange)="manage.onSelection($event)">
    <!-- "Create new | Manage" (ESF's New / Delete), then Refresh. -->
    <tb-table-links dt-footer [manage]="manage" [busy]="!!deleting" [deleting]="deleting" [manageDisabled]="!rows.length" [createDisabled]="loading"
                    (create)="openCreate()" (delete)="askDelete()">
      <tb-table-link [disabled]="loading" (action)="load()">Refresh</tb-table-link>
    </tb-table-links>
  </tb-data-table>

  <ng-container *ngIf="picked as p">
    <div class="ea-head"><span class="ea-name">{{ p.row.pid }}</span><span class="ea-what">{{ p.heading }}</span></div>
    <tb-gm-esf-settings *ngIf="p.row.kind === 'driver'; else assetEditor" [client]="client" [api]="configApi" [gatewayName]="gatewayName" picker="fixed"
                        [components]="p.pids" [wide]="true" (notify)="notify.emit($event)"></tb-gm-esf-settings>
    <ng-template #assetEditor>
      <tb-gm-esf-asset-editor [client]="client" [pid]="p.row.pid" [driverType]="p.driverType" [templates]="p.templates"
                              [tooManyChannels]="p.tooManyChannels" [gatewayName]="gatewayName" (notify)="notify.emit($event)"></tb-gm-esf-asset-editor>
    </ng-template>
  </ng-container>
</div>
