<div class="ev">
  <!-- The unit's snapshots, newest first: a row's Rollback (confirmed); Take snapshot and Refresh at the table's foot. -->
  <tb-callout *ngIf="error" type="warning" title="Couldn't read the snapshots">
    {{ error }} <button type="button" class="ev-link" (click)="load()">Try again</button>
  </tb-callout>
  <tb-data-table *ngIf="!error" title="Snapshots" [compactHeader]="true" [columns]="columns" [rows]="rows" [wireframe]="loading && !rows.length"
                 [wireframeRowCount]="4" trackByKey="key" [searchEnabled]="false" [fitPageSize]="true" [rowHover]="false" emptyText="No snapshots"
                 emptyIcon="history">
    <ng-template tbDataTableCell="latest" let-row>
      <tb-status-pill *ngIf="row.latest" tone="brand">Latest</tb-status-pill>
    </ng-template>
    <ng-template tbDataTableCell="action" let-row>
      <button type="button" class="ev-link danger" [class.ev-busy]="rollingBack === row.id" [disabled]="busy" (click)="askRollback(row)">
        {{ rollingBack === row.id ? "Rolling back" : "Rollback" }}
      </button>
    </ng-template>
    <tb-table-links dt-footer [canCreate]="false">
      <tb-table-link [divider]="false" [busy]="taking" busyLabel="Taking snapshot" [disabled]="busy" (action)="takeSnapshot()">Take snapshot</tb-table-link>
      <tb-table-link [disabled]="loading" (action)="load()">Refresh</tb-table-link>
    </tb-table-links>
  </tb-data-table>
</div>
