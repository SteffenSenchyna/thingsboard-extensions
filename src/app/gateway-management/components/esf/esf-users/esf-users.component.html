<div class="ev">
  <tb-callout *ngIf="error" type="warning" title="Couldn't read the users">
    {{ error }} <button type="button" class="ev-link" (click)="load()">Try again</button>
  </tb-callout>
  <!-- As ESF's Identities page: a row a user — it opens in the side panel; Create new there; Manage deletes. -->
  <tb-data-table *ngIf="!error" #table title="Users" [compactHeader]="true" [columns]="columns" [rows]="rows" [wireframe]="loading && !rows.length"
                 [wireframeRowCount]="3" trackByKey="name" [searchEnabled]="false" [fitPageSize]="true" [selectable]="true"
                 [selectedKey]="openName || null" (rowClick)="openRow($event)" [multiSelect]="manage.managing"
                 (selectionChange)="manage.onSelection($event)" emptyText="No users" emptyIcon="group">
    <ng-template tbDataTableCell="login" let-row>
      <span class="ev-actions">
        <tb-status-pill [tone]="row.passwordAuthEnabled ? 'success' : 'neutral'">{{ row.passwordAuthEnabled ? "On" : "Off" }}</tb-status-pill>
        <tb-status-pill *ngIf="row.passwordChangeNeeded" tone="warning">Change due</tb-status-pill>
      </span>
    </ng-template>
    <tb-table-links dt-footer [manage]="manage" [busy]="!!deleting" [deleting]="deleting" [manageDisabled]="!rows.length" [createDisabled]="loading"
                    (create)="openCreate()" (delete)="askDelete()"></tb-table-links>
  </tb-data-table>
</div>
