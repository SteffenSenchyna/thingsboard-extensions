<div class="ev">
  <tb-collapsible-card title="Command" [collapsible]="false">
    <form class="ev-fields" (ngSubmit)="run()">
      <div class="ev-field">
        <label class="ev-label" for="esf-command">Command</label>
        <input id="esf-command" name="command" class="ev-input" type="text" autocomplete="off" spellcheck="false" [(ngModel)]="command" />
      </div>
      <div class="ev-row">
        <div class="ev-field">
          <label class="ev-label" for="esf-command-dir">Working directory</label>
          <input id="esf-command-dir" name="workingDirectory" class="ev-input" type="text" autocomplete="off" spellcheck="false" [(ngModel)]="workingDirectory" />
        </div>
        <div class="ev-field">
          <label class="ev-label" for="esf-command-password">Command password</label>
          <tb-secret-box inputId="esf-command-password" name="password" [(ngModel)]="password"></tb-secret-box>
        </div>
      </div>
      <button type="submit" class="ev-submit" [class.ev-busy]="running" [disabled]="!command.trim() || running">Run</button>
    </form>
  </tb-collapsible-card>

  <!-- The last run, as the gateway's RPC results show a reply: its exit code (or that it timed out), the command, when it came
       back; then what it printed, each box copying itself on a click. At the form width, as the Command card above it. -->
  <tb-collapsible-card *ngIf="result" title="Result" [collapsible]="false">
    <div class="ec-result-head">
      <tb-status-pill *ngIf="result.timedOut; else exit" tone="warning" icon="timer_off">Timed out</tb-status-pill>
      <ng-template #exit>
        <tb-status-pill [tone]="result.exitCode === 0 ? 'success' : 'error'" [icon]="result.exitCode === 0 ? 'check_circle' : 'error'">
          Exit code {{ result.exitCode ?? "—" }}
        </tb-status-pill>
      </ng-template>
      <span class="ec-method">{{ ran }}</span>
      <span class="ec-result-time">{{ ranAt }}</span>
    </div>
    <div class="ev-fields">
      <ng-container *ngFor="let out of outputs">
        <div>
          <div class="ev-pre-label">{{ out.label }}</div>
          <div class="ec-result-box" role="button" tabindex="0" [attr.aria-label]="copied === out.key ? 'Copied' : 'Copy ' + out.label.toLowerCase()"
               (click)="copy(out)" (keydown.enter)="copy(out)">
            <pre class="ec-result">{{ out.text }}</pre>
            <span class="ec-copy" [class.copied]="copied === out.key" aria-hidden="true"><mat-icon>{{ copied === out.key ? "check" : "content_copy" }}</mat-icon></span>
          </div>
        </div>
      </ng-container>
      <div *ngIf="!outputs.length" class="ev-empty">No output</div>
    </div>
  </tb-collapsible-card>
</div>
