<!-- The tank form, every card built of the shared setting pieces (a stack of fields, rows of equal columns, a field's label and
     note) — as every settings card. -->
<form class="tkf" [formGroup]="form" (ngSubmit)="submit()">
  <!-- The device: its name, then its label. Add only — the settings card has them when editing. -->
  <tb-card *ngIf="mode === 'add'">
    <tb-setting-stack>
      <tb-setting-field label="Name" inputId="tkf-name">
        <input id="tkf-name" type="text" formControlName="name" autocomplete="off" />
      </tb-setting-field>
      <tb-setting-field label="Label" inputId="tkf-label">
        <input id="tkf-label" type="text" formControlName="label" autocomplete="off" />
      </tb-setting-field>
    </tb-setting-stack>
  </tb-card>

  <!-- The product in the tank. Add only — when editing it's the settings card's Product card. -->
  <tb-collapsible-card *ngIf="mode === 'add'" title="Product">
    <tb-setting-stack>
      <tb-setting-field label="Liquid type">
        <tb-select [options]="liquidOptions" formControlName="liquidType"></tb-select>
      </tb-setting-field>
    </tb-setting-stack>
  </tb-collapsible-card>

  <!-- The tank: a vertical cylinder — its height and diameter give its capacity. -->
  <tb-collapsible-card title="Tank" info="Vertical cylinder. Capacity comes from its size.">
    <tb-setting-stack>
      <tb-setting-row [even]="true">
        <!-- A few short, fixed options: the shared button group (as QC Lab's temperature unit) — the system, then its units. -->
        <tb-setting-field label="Measurement system">
          <tb-button-group [options]="systemOptions" formControlName="tankMeasurementSystem"></tb-button-group>
        </tb-setting-field>
        <tb-setting-field label="Dimension units">
          <tb-button-group [options]="dimensionUnitOptions" formControlName="tankDimensionUnits"></tb-button-group>
        </tb-setting-field>
      </tb-setting-row>
      <!-- Its height and diameter: the shared number box, its unit inside it (as the alarm thresholds'). -->
      <tb-setting-row [even]="true">
        <tb-setting-field *ngFor="let f of dimensions" [label]="f.label" [inputId]="'tkf-' + f.id">
          <tb-number-box [inputId]="'tkf-' + f.id" [min]="0" [unit]="dimensionUnit" [formControlName]="f.id"></tb-number-box>
        </tb-setting-field>
      </tb-setting-row>
      <tb-setting-field label="Capacity units">
        <tb-button-group [options]="capacityUnitOptions" formControlName="tankCapacityOutput"></tb-button-group>
      </tb-setting-field>
      <!-- Worked out from its height and diameter: a line of text, never a field of its own (nothing to enter). -->
      <tb-setting-note icon="water_full">{{ capacityText }}</tb-setting-note>
    </tb-setting-stack>
  </tb-collapsible-card>

  <!-- The level sensor: what it measures, from where, and in which units. -->
  <tb-collapsible-card title="Sensor" info="What the sensor measures, and in which units.">
    <tb-setting-stack>
      <!-- How the sensor measures — two modes with consequences (Remaining space adds the sensor gap): a radio group, each explained. -->
      <tb-setting-field label="Level measurement">
        <tb-radio-group [options]="levelOptions" ariaLabel="Level measurement" formControlName="levelMeasurement"></tb-radio-group>
      </tb-setting-field>
      <tb-setting-row [even]="true">
        <tb-setting-field label="Measurement system">
          <tb-button-group [options]="systemOptions" formControlName="sensorMeasurementSystem"></tb-button-group>
        </tb-setting-field>
        <tb-setting-field label="Reading units">
          <tb-button-group [options]="sensorUnitOptions" formControlName="sensorDimensionUnits"></tb-button-group>
        </tb-setting-field>
      </tb-setting-row>
      <!-- Its note in the label's info bubble, never helper text under the field. -->
      <tb-setting-field *ngIf="needsSensorGap" label="Sensor gap" inputId="tkf-gap" info="Sensor to full level.">
        <tb-number-box inputId="tkf-gap" [min]="0" [max]="999" [unit]="sensorUnit" formControlName="sensorGap"></tb-number-box>
      </tb-setting-field>
    </tb-setting-stack>
  </tb-collapsible-card>

  <!-- Add only: editing saves through the settings card's floating Cancel / Apply. -->
  <tb-form-actions *ngIf="mode === 'add'" [submitLabel]="saving ? 'Creating…' : 'Create tank'" [disabled]="!canSubmit"
                   (cancelled)="cancelled.emit()"></tb-form-actions>
</form>
