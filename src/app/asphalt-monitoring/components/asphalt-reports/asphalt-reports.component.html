<!-- The insights: what stands out — a card each, warnings first; a click opens its folded section below and scrolls to it. -->
<!-- Wireframed until the movements are checked against their raw readings too (the largest fill is a confirmed one). -->
<tb-insight-list [insights]="report.insights" [wireframe]="wireframe || report.details.movementsLoading" (insightClick)="openInsight($event)"></tb-insight-list>

<!-- The figures strip: what's on hand (its change since the window's start, its course a slot, how fresh), then what was received
     and dispensed, dispensed a day, the days of supply, the low point and the tanks reporting. -->
<tb-stat-grid [headline]="report.figures.headline" [items]="report.figures.items" [columns]="3" [wireframe]="wireframe"></tb-stat-grid>

<!-- The cards: what's on hand by product (a split), the tanks ranked by what they hold and by what they dispensed. -->
<tb-summary-cards [cards]="report.summary" [dark]="dark" [wireframe]="wireframe"></tb-summary-cards>

<!-- On hand over the window, a line a product — from 0 t, so a fill or a draw looks its size (auto-scaled, a few tonnes filled the plot). -->
<tb-collapsible-card title="On hand over time" [collapsible]="false" info="Tonnes on hand, by product">
  <tb-line-chart [series]="report.inventory.series" unit="t" [xMin]="report.inventory.xMin" [xMax]="report.inventory.xMax" [yMin]="0" [yDecimals]="0"
                 height="260px" [dark]="dark" [animated]="false" [loading]="wireframe"></tb-line-chart>
</tb-collapsible-card>

<!-- Received and dispensed a slot — a plain bar chart, a bar each, every slot labelled — and, beside it, this period against the last (the
     same days, to the same time) — the chart over the card on narrow widths. -->
<div class="ar-main">
  <tb-collapsible-card [title]="movementTitle" [collapsible]="false" info="Tonnes received (the tanks' fills) and dispensed (their draws)">
    <tb-bar-chart [categories]="report.movement.categories" [series]="report.movement.series" unit="t" [tooltipTitles]="report.movement.titles"
                  height="260px" [dark]="dark" [wireframe]="wireframe"></tb-bar-chart>
  </tb-collapsible-card>
  <tb-collapsible-card title="This period vs last" [collapsible]="false" info="Each figure against the same days of the period before, to the same time">
    <tb-stat-grid [items]="report.versus || versusWireframe" [columns]="1" [wireframe]="wireframe || !report.versus"></tb-stat-grid>
  </tb-collapsible-card>
</div>

<!-- The folded sections: a heading each — its count after it — over a sortable table, folded to start: the days (a day's window: its
     hours), the tanks and the movements (each fill and draw). -->
<div class="ar-sections">
  <tb-collapsible-card [flat]="true" data-section="slots" [(expanded)]="open.slots" [title]="slotTitle" [count]="wireframe ? null : report.details.slots.length">
    <tb-data-table [showHeader]="false" [columns]="slotColumns" [rows]="report.details.slots" [sortable]="true" [fitPageSize]="true"
                   [loading]="wireframe" trackByKey="id" emptyText="No readings"></tb-data-table>
  </tb-collapsible-card>
  <tb-collapsible-card [flat]="true" data-section="tanks" [(expanded)]="open.tanks" title="Tanks" [count]="wireframe ? null : report.details.tanks.length">
    <tb-data-table [showHeader]="false" [columns]="tankColumns" [rows]="report.details.tanks" [sortable]="true" [fitPageSize]="true"
                   [loading]="wireframe" trackByKey="id" emptyText="No tanks"></tb-data-table>
  </tb-collapsible-card>
  <!-- Each fill and draw the raw readings show — its start and duration theirs (wireframed while they're read); a slow drift isn't listed. -->
  <tb-collapsible-card [flat]="true" data-section="movements" [(expanded)]="open.movements" title="Movements"
                       [count]="wireframe || report.details.movementsLoading ? null : report.details.movements.length">
    <tb-data-table [showHeader]="false" [columns]="movementColumns" [rows]="report.details.movements" [sortable]="true" [fitPageSize]="true"
                   [loading]="wireframe || report.details.movementsLoading" trackByKey="id" emptyText="No fills or draws">
      <!-- Fill (the brand's pill) or Draw (neutral), its arrow. -->
      <ng-template tbDataTableCell="kind" let-row>
        <tb-status-pill [tone]="row.tone" [icon]="row.icon">{{ row.kind }}</tb-status-pill>
      </ng-template>
    </tb-data-table>
  </tb-collapsible-card>
</div>
