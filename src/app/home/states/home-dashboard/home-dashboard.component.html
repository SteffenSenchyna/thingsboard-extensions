<div tbDashboardRoot [class.dark]="darkMode" class="home-dashboard">

  <!-- Icon rail: Home, Gateways, a divider, the apps (an app's pages the menu beside it, on hover); its second group the alarms (their count) and — tenant administrators —
       Settings, else the theme toggle. -->
  <tb-nav-rail [ctx]="ctx" [items]="railItems" [active]="railActive" (activeChange)="selectPage($event)"
               [bottomItems]="railBottomItems" [footItems]="railFootItems"
               (bottomClick)="onRailBottomClick($event)"></tb-nav-rail>

  <div class="home-main" [class.home-main--app]="!!appPage">

    <!-- Home, for who the viewer is (their scope — a plant, a market, a product line, everything), in the Fuel Reports page's look: the
         alarms' figures strip first (the last 30 days against the 30 before), then the summary cards (a scope's: its devices, active
         alarms, top alarms, devices by app — a split bar and its lines), the ranked cards a level under the scope (a plant's: none —
         each line its share, its bar online and offline) and the alarms' map by the day of the week and the hour. -->
    <div *ngIf="page === 'home'" class="home-page">
      <!-- The alarms' figures strip (the days the backend keeps — the Alarms Per Day rule chain: the viewer's scope's, a tenant
           administrator's every device's), at the top as the Fuel Reports page's. -->
      <tb-stat-grid *ngIf="alarmStrip as strip" [headline]="strip.headline" [items]="strip.items" [columns]="2"
                    [wireframe]="alarmsPerDayLoading"></tb-stat-grid>

      <tb-summary-cards [cards]="summaryCards" [dark]="darkMode"></tb-summary-cards>

      <!-- Devices by two dimensions a level under the scope: ranked, each line its devices, its share, its bar in online and offline. -->
      <tb-summary-cards *ngIf="rankCards.length" [cards]="rankCards" [dark]="darkMode"></tb-summary-cards>

      <!-- When the alarms start: the last 30 days' by the day of the week and the hour of the day — the Fuel Reports page's dispenses' map. -->
      <tb-collapsible-card class="home-alarms" title="Alarms by day and hour" [collapsible]="false"
                           info="Alarms raised in each hour of each day of the week over the last 30 days">
        <tb-hour-heatmap [rows]="alarmWeekRows" [columns]="alarmHours" [values]="alarmWeekHour" unit="alarms"
                         [wireframe]="alarmWeekHourLoading"></tb-hour-heatmap>
      </tb-collapsible-card>
    </div>

    <!-- A nested app (nested-dashboard.ts): the dashboard itself, edge to edge — its own frame, Home's theme; its pages are the
         menu beside its icon in the rail. -->
    <div *ngIf="appPage" class="home-app" [ngSwitch]="appPage">
      <tb-gm-dashboard *ngSwitchCase="'gateways'" [ctx]="ctx" [host]="hosts.gateways"></tb-gm-dashboard>
      <tb-marine-dashboard *ngSwitchCase="'marine'" [ctx]="ctx" [host]="hosts.marine"></tb-marine-dashboard>
      <tb-fuel-management-dashboard *ngSwitchCase="'fuel'" [ctx]="ctx" [host]="hosts.fuel"></tb-fuel-management-dashboard>
      <tb-qc-lab-monitoring-dashboard *ngSwitchCase="'qc'" [ctx]="ctx" [host]="hosts.qc"></tb-qc-lab-monitoring-dashboard>
      <tb-asphalt-dashboard *ngSwitchCase="'asphalt'" [ctx]="ctx" [host]="hosts.asphalt"></tb-asphalt-dashboard>
      <tb-aria-dashboard *ngSwitchCase="'aria'" [ctx]="ctx" [host]="hosts.aria"></tb-aria-dashboard>
    </div>

    <!-- Settings (tenant administrators), as the fuel and gateway dashboards': the section menu — and, on the Access pages and Sites,
         their filters column beside it — then the section: the Applications, the Organization, the Access (groups, users), the Feedback, the Account. -->
    <!-- Devices, Assets (tenant administrators): the tenant's devices, its assets — each its own page, as ThingsBoard's. -->
    <tb-entity-manager *ngIf="page === 'devices'" [kind]="'device'" [ctx]="ctx" [notices]="toasts"></tb-entity-manager>
    <tb-entity-manager *ngIf="page === 'assets'" [kind]="'asset'" [ctx]="ctx" [notices]="toasts"></tb-entity-manager>
    <!-- Device profiles, Asset profiles (tenant administrators): as ThingsBoard's Profiles pages — each profile's icon is what every dashboard shows its devices / assets by. -->
    <tb-profile-manager *ngIf="page === 'deviceProfiles'" [kind]="'device'" [ctx]="ctx" [notices]="toasts"></tb-profile-manager>
    <tb-profile-manager *ngIf="page === 'assetProfiles'" [kind]="'asset'" [ctx]="ctx" [notices]="toasts"></tb-profile-manager>

    <!-- Settings (tenant administrators'; a user's: Account alone, at the rail's foot): the section the rail picked — its sections are the rail's last group. An Access page and the Sites
         page have a sidebar of filters (no section menu: the rail is it); the others, none. -->
    <ng-container *ngIf="page === 'settings'">
      <tb-sidebar-layout *ngIf="settingsHasFilters; else settingsAlone" [(open)]="sidebarOpen" [width]="sidebarWidth" [collapseToggle]="true">
        <!-- No section menu (the rail is it): the section's filters alone — Access › Users' button group picking its list. -->
        <tb-settings-sidebar sidebar [section]="settingsSection" [org]="org" [access]="access" [feedback]="feedback"
                             (sectionChange)="selectSettingsSection($event)"></tb-settings-sidebar>
        <div class="home-view"><ng-container *ngTemplateOutlet="settingsView"></ng-container></div>
      </tb-sidebar-layout>
      <ng-template #settingsAlone>
        <div class="home-view"><ng-container *ngTemplateOutlet="settingsView"></ng-container></div>
      </ng-template>
      <ng-template #settingsView>
        <tb-organization-settings *ngIf="organizationSection; else otherSettings" [store]="org" [section]="settingsSection"></tb-organization-settings>
        <ng-template #otherSettings>
          <tb-access-settings *ngIf="accessPage as accessPg; else appSettings" [store]="access" [page]="accessPg" (sectionChange)="selectSettingsSection($event)"></tb-access-settings>
        </ng-template>
        <ng-template #appSettings>
          <tb-application-settings *ngIf="settingsSection === 'applications'; else feedbackSettings" [store]="apps"></tb-application-settings>
        </ng-template>
        <ng-template #feedbackSettings>
          <tb-feedback-settings *ngIf="settingsSection === 'feedback'; else accountSettings" [store]="feedback"></tb-feedback-settings>
        </ng-template>
        <ng-template #accountSettings>
          <tb-account-settings [ctx]="ctx" [notices]="toasts" [theme]="theme.mode" (themeChange)="theme.set($event)"></tb-account-settings>
        </ng-template>
      </ng-template>
    </ng-container>
  </div>

  <!-- The Settings page's panels and dialogs (the shared stores'), in the dashboard root. -->
  <tb-organization-panels [store]="org" (deviceOpen)="openSiteDevice($event)"></tb-organization-panels>
  <!-- A device picked on a plant's Devices tab or in an Access › Health check: its Details panel in place (the Devices page's own,
       tb-entity-panel) — the trail's next stop, as a user picked on a Users tab. -->
  <tb-entity-panel #siteDevicePanel [ctx]="ctx" [notices]="toasts" kind="device" [trail]="access.trail"></tb-entity-panel>
  <tb-application-panels [store]="apps"></tb-application-panels>
  <tb-access-panels [store]="access" (deviceOpen)="openSiteDevice($event)"></tb-access-panels>
  <!-- An item of Settings › Feedback. -->
  <tb-feedback-panels [store]="feedback"></tb-feedback-panels>
  <!-- A device's alarm notifications, opened from the Account page's Notifications table. -->
  <tb-alarm-notification-panel [ctx]="ctx" [notices]="toasts"></tb-alarm-notification-panel>

  <!-- Alarms panel (the rail's bell, under Home): every app, grouped per device. -->
  <tb-alarm-panel [ctx]="ctx" [open]="alarmPanelOpen" [alarms]="alarms" [loading]="alarmsLoading" [subtitle]="alarmPanelSubtitle" (closed)="closeAlarms()"
                  (clear)="clearAlarm($event)"></tb-alarm-panel>

  <!-- Send feedback (the rail's): its dialog (a nested app's too). -->
  <tb-feedback-dialog [ctx]="ctx" [notices]="toasts"></tb-feedback-dialog>

  <tb-ext-toasts #toasts></tb-ext-toasts>

  <!-- The loading page, over the whole dashboard, until its first load is in. -->
  <tb-dashboard-loading [loading]="pageLoading"></tb-dashboard-loading>
</div>
