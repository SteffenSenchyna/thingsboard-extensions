<!-- The tenant's device (or asset) profiles: the sidebar (the search, "Clear filters"), then the table — paged, sorted and searched on
     the server — with "Create new | Manage" at its foot. A row opens its side panel. -->
<div class="pm-page">
<tb-sidebar-layout [(open)]="sidebarOpen" [width]="300" [collapseToggle]="true">
  <div sidebar class="pm-sidebar">
    <div class="pm-filters">
      <tb-search-box [terms]="search" placeholder="Search" (searchChange)="setSearch($event)"></tb-search-box>
    </div>
    <div class="pm-sidebar-links">
      <button type="button" class="pm-link" [disabled]="!hasFilters" (click)="clearFilters()">Clear filters</button>
    </div>
  </div>

  <div class="pm-view">
    <tb-data-table #table [showHeader]="false" [columns]="columns" [rows]="rows" [loading]="loading" [fillHeight]="true"
                   [serverTotal]="total" [serverPage]="page" [pageSize]="pageSize" (pageChange)="onPage($event)" [sortable]="true" [sort]="sort" (sortChange)="onSort($event)"
                   trackByKey="id" [selectable]="true" [selectedKey]="selectedId" [multiSelect]="managing" (selectionChange)="onSelection($event)"
                   (rowClick)="openRow($event)" [emptyText]="'No ' + noun + 's' + (hasFilters ? ' match the search' : '')"
                   [emptyIcon]="kindIcon" [loadingText]="'Loading ' + noun + 's…'">
      <!-- ThingsBoard's default profile of the kind (a new device / asset takes it). -->
      <ng-template tbDataTableCell="default" let-row>
        <tb-status-pill *ngIf="row.isDefault" tone="brand">Default</tb-status-pill>
      </ng-template>

      <!-- "Create new | Manage"; managing, "Delete (n) | Select page / Deselect page | Done" (the page shown: the rest is on the server). -->
      <tb-table-links dt-footer [manage]="manage" [busy]="saving" [manageDisabled]="!total" [pageOnly]="true" (create)="openAdd()"
                      (delete)="askDelete(checkedRows)"></tb-table-links>
    </tb-data-table>
  </div>
</tb-sidebar-layout>

<!-- The loading page over the sidebar and the table: the page's first load only (the side panel and the dialog stay outside it). -->
<tb-dashboard-loading [section]="true" [loading]="pageLoading"></tb-dashboard-loading>
</div>

<!-- The side panel: Details — the form, then Manage (Set as default, Delete; not for a new one). -->
<tb-entity-detail-panel [open]="panelOpen" [icon]="panelIcon" [name]="panelName" [subtitle]="panelSubtitle"
                        [tabs]="panelTabs" initialTab="details" [dismissible]="true" (closed)="closePanel()">
  <div tab-content class="pm-panel">
    <tb-profile-form [kind]="kind" [value]="editing" [profile]="editingProfile" [icon]="editingIcon" [choices]="choices" [resetKey]="resetKey"
                     [saving]="saving" (submitted)="save($event)" (cancelled)="closePanel()">
      <tb-manage-card *ngIf="editing">
        <tb-manage-action [disabled]="saving || editing.isDefault" (action)="setDefault()">Set as default</tb-manage-action>
        <tb-manage-action [danger]="true" [disabled]="saving" (action)="askDelete([editing])">Delete</tb-manage-action>
      </tb-manage-card>
    </tb-profile-form>
  </div>
</tb-entity-detail-panel>

<!-- Delete (a row's, or the checked ones') — themed with the dashboard. -->
<tb-ext-confirm-dialog [open]="!!deleteConfirm" [heading]="deleteHeading" [message]="deleteMessage" confirmLabel="Delete" [danger]="true"
                       (confirmed)="confirmDelete()" (cancelled)="deleteConfirm = null"></tb-ext-confirm-dialog>
