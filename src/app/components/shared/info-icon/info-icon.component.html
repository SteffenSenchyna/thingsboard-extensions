<span #icon class="ii" tabindex="0" role="img" aria-label="Info" (mouseenter)="place()" (focus)="place()">
  <mat-icon>info</mat-icon>
  <span #tip class="ii-tip" [class.ii-tip--right]="horizontal === 'right'" [class.ii-tip--left]="horizontal === 'left'"
        [class.ii-tip--below]="below">{{ text }}</span>
</span>
