<!-- The form's input box: a file icon, the file picked and its size (the placeholder's muted text with none); a click opens the
     browser's file picker, a file dropped on it is picked. -->
<button type="button" class="tbff" [attr.id]="inputId" [class.tbff--empty]="!value" [class.tbff--invalid]="invalid" [class.tbff--over]="over"
        [disabled]="disabled" (click)="open()" (dragover)="dragOver($event)" (dragleave)="dragLeave()" (drop)="drop($event)">
  <mat-icon>upload_file</mat-icon>
  <span class="tbff-text">{{ value?.name || placeholder }}</span>
  <span *ngIf="value" class="tbff-size">{{ size }}</span>
</button>
<input #picker class="tbff-picker" type="file" tabindex="-1" aria-hidden="true" [attr.accept]="accept || null" (change)="picked(picker)" />
