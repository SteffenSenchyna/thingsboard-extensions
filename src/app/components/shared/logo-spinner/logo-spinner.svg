  <!-- The app's logo as a loading spinner, for use outside the dashboards (they use tb-logo-spinner): the tree and the ring
       stay still; an arc bounces between the two sides of the slit at the ring's foot — out of the left side it grows round
       the ring to the right side and draws in to it, then grows back to the left and draws in to that. Its keyframes are
       the component's (logo-spinner.component.scss), worked out. Light / dark by the viewer's colour scheme. -->
