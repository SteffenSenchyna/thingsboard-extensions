<!-- The box: the hidden (or shown) value, then the eye and the copy button in their own cells. -->
<div class="sb-box" [class.sb-disabled]="disabled">
  <!-- A text field masked by CSS, never a password field — and marked for the password managers to leave alone (1Password, LastPass,
       Bitwarden, Dashlane): it holds a webhook, not a sign-in, so they offer no logins on it and don't save it. -->
  <input #input class="sb-input" type="text" [class.sb-masked]="!revealed && !!value" [id]="inputId || null" [value]="value" [placeholder]="placeholder"
         [disabled]="disabled" [readOnly]="readonly" [attr.aria-label]="ariaLabel || null" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
         data-1p-ignore="true" data-lpignore="true" data-bwignore="true" data-form-type="other"
         (input)="onInput(input.value)" (blur)="onBlur()" />
  <button type="button" class="sb-btn" [attr.aria-label]="revealed ? 'Hide' : 'Show'" [attr.aria-pressed]="revealed" (click)="toggleReveal()" tabindex="-1">
    <mat-icon>{{ revealed ? "visibility_off" : "visibility" }}</mat-icon>
  </button>
  <button type="button" class="sb-btn" [class.copied]="copied" aria-label="Copy" [disabled]="!value" (click)="copy()" tabindex="-1">
    <mat-icon>{{ copied ? "check" : "content_copy" }}</mat-icon>
  </button>
</div>
