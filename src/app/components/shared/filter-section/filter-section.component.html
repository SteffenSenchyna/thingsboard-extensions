<div class="tbfs-header">
  <span class="tbfs-heading">{{ heading }}</span>
  <button type="button" class="tbfs-toggle" [attr.aria-expanded]="open"
          [attr.aria-label]="(open ? 'Collapse ' : 'Expand ') + heading" (click)="toggle()">
    <mat-icon class="tbfs-chevron" [class.collapsed]="!open">expand_less</mat-icon>
  </button>
</div>
<!-- Folds closed / open (the collapsible cards' timing); hidden, not destroyed, so the filter keeps its state. -->
<div class="tbfs-body-wrap" [class.tbfs-collapsed]="!open" [attr.inert]="open ? null : ''">
  <div class="tbfs-body">
    <ng-content></ng-content>
  </div>
</div>
