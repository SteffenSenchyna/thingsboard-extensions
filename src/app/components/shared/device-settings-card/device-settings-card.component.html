<div class="ds-cards">
  <!-- Every card's body is the shared setting pieces (tb-setting-stack / -section / -object / -field / -checks / -row /
       -divider): QC Lab's settings look, reused by any settings form. -->
  <!-- Per-device identity fields — hidden when editing several devices at once. -->
  <tb-card *ngIf="!isBulk" [style.display]="hideIdentity ? 'none' : null">
    <tb-setting-stack [formGroup]="form">
      <tb-setting-field label="Name">
        <tb-copy-box [value]="hostname || '—'" [fullWidth]="true" [inputSized]="true"></tb-copy-box>
      </tb-setting-field>

      <tb-setting-field label="Name (Label)">
        <input type="text" formControlName="label" placeholder="Set a name" aria-label="Name (Label)" />
      </tb-setting-field>

      <tb-setting-field *ngIf="groups.length" label="Groups">
        <div class="ds-groups">
          <span class="ds-group-chip" *ngFor="let g of groups">{{ g }}</span>
        </div>
      </tb-setting-field>

      <!-- A dashboard's own identity field (a gateway's applications), between the label and the note. -->
      <ng-content select="[identity]"></ng-content>

      <tb-setting-field label="Note">
        <textarea formControlName="description" rows="3" placeholder="Add a note" aria-label="Note"></textarea>
      </tb-setting-field>
    </tb-setting-stack>
  </tb-card>

  <!-- Attribute-backed selects (e.g. Sensor channels, a scale's model): a short card, its heading fixed — no fold button. -->
  <tb-collapsible-card *ngIf="attributeSelects.length" [title]="attributeCardTitle" [collapsible]="false">
    <tb-setting-stack [formGroup]="form">
      <tb-setting-field *ngFor="let sel of attributeSelects" [label]="sel.label">
        <tb-select [options]="sel.options" [formControlName]="sel.key"></tb-select>
      </tb-setting-field>
    </tb-setting-stack>
  </tb-collapsible-card>

  <!-- SHARED_SCOPE device settings (toggles / button groups / inputs). -->
  <tb-collapsible-card *ngIf="deviceSettings.length" [title]="deviceSettingsTitle">
    <tb-setting-stack [formGroup]="form">
      <!-- Boolean toggles, two a row. -->
      <tb-setting-checks *ngIf="toggleSettings.length">
        <tb-ext-checkbox *ngFor="let s of toggleSettings" [label]="s.label" [info]="s.info || ''" [triState]="isBulk"
                         [formControlName]="s.key"></tb-ext-checkbox>
      </tb-setting-checks>

      <!-- Segmented button groups side by side on one row. -->
      <tb-setting-row *ngIf="segmentedSettings.length">
        <tb-setting-field *ngFor="let s of segmentedSettings" [label]="s.label">
          <tb-button-group [options]="s.options || []" [formControlName]="s.key"></tb-button-group>
        </tb-setting-field>
      </tb-setting-row>

      <!-- Everything else stacked. -->
      <ng-container *ngFor="let s of otherSettings">
        <tb-setting-field *ngIf="s.kind === 'buttons'" [label]="s.label">
          <tb-button-group [options]="s.options || []" [formControlName]="s.key"></tb-button-group>
        </tb-setting-field>

        <tb-setting-field *ngIf="s.kind === 'select'" [label]="s.label">
          <tb-select [options]="s.options || []" [formControlName]="s.key"></tb-select>
        </tb-setting-field>

        <tb-setting-field *ngIf="s.kind === 'number'" [label]="s.label">
          <tb-number-box [min]="s.min" [max]="s.max" [step]="s.step ?? 1" [unit]="s.unit || ''" [ariaLabel]="s.label" [formControlName]="s.key"></tb-number-box>
        </tb-setting-field>

        <tb-setting-field *ngIf="s.kind === 'slider'" [label]="s.label" [info]="s.info || ''">
          <tb-slider-stepper [min]="s.min ?? 0" [max]="s.max ?? 100" [step]="s.step ?? 1" [unit]="s.unit || ''"
                             [formControlName]="s.key"></tb-slider-stepper>
        </tb-setting-field>
      </ng-container>
    </tb-setting-stack>
  </tb-collapsible-card>

  <!-- SHARED_SCOPE JSON-object attributes (e.g. Calibration, Alarms): the shared setting pieces (tb-setting-stack / -object /
       -field / -divider) — a switch heading each object, folding open its fields. -->
  <tb-collapsible-card *ngFor="let card of objectCards" [title]="card.title" [info]="card.info || ''">
    <tb-setting-stack [formGroup]="form">
      <ng-container *ngFor="let grp of card.groups; let first = first">
        <!-- Divider between channel/section configs. -->
        <tb-setting-divider *ngIf="!first"></tb-setting-divider>

        <tb-setting-section [heading]="grp.title || ''">

          <tb-setting-object *ngFor="let obj of grp.objects" [gated]="!!gateOf(obj)" [label]="obj.label || ''"
                             [open]="isObjGateOn(obj)" [flat]="!!card.flatFields">
            <!-- Gate switch (object enable) + a bulk-only "Disable" to its right
                 that forces the setting off across the selected devices. -->
            <tb-ext-switch gate *ngIf="gateOf(obj) as gate" [label]="obj.label" [heading]="true"
                           [formControlName]="objCtrl(obj.key, gate.key)"></tb-ext-switch>
            <tb-ext-checkbox gate-extra *ngIf="isBulk && gateOf(obj)" label="Disable" [ngModel]="isSetNull(obj)"
                             [ngModelOptions]="{ standalone: true }" (ngModelChange)="toggleSetNull(obj)"></tb-ext-checkbox>

            <!-- Its fields — revealed while the gate is on; a field with `showWhen` only while its condition holds (a threshold's Min / Max). -->
            <ng-container *ngFor="let f of fieldsOf(obj)"><ng-container *ngIf="isFieldShown(obj, f)">
              <!-- Boolean toggle. -->
              <tb-ext-checkbox *ngIf="f.kind === 'toggle'" [label]="f.label" [info]="f.info || ''"
                               [formControlName]="ctrlName(obj, f)"></tb-ext-checkbox>

              <!-- Single-select button group. -->
              <tb-setting-field *ngIf="f.kind === 'buttons' || f.kind === 'segmented'" [label]="f.label">
                <tb-button-group [options]="f.options || []" [formControlName]="ctrlName(obj, f)"></tb-button-group>
              </tb-setting-field>

              <!-- Themed dropdown. -->
              <tb-setting-field *ngIf="f.kind === 'select'" [label]="f.label">
                <tb-select [options]="f.options || []" [formControlName]="ctrlName(obj, f)"></tb-select>
              </tb-setting-field>

              <!-- Numeric input. -->
              <tb-setting-field *ngIf="f.kind === 'number'" [label]="f.label">
                <tb-number-box [min]="f.min" [max]="f.max" [step]="f.step ?? 1" [unit]="f.unit || ''" [ariaLabel]="f.label"
                               [formControlName]="ctrlName(obj, f)"></tb-number-box>
              </tb-setting-field>

              <!-- Slider + stepper (unit may be derived live via unitFrom). -->
              <tb-setting-field *ngIf="f.kind === 'slider'" [label]="f.label" [info]="f.info || ''">
                <tb-slider-stepper [min]="f.min ?? 0" [max]="f.max ?? 100" [step]="f.step ?? 1" [unit]="unitFor(f)"
                                   [formControlName]="ctrlName(obj, f)"></tb-slider-stepper>
              </tb-setting-field>
            </ng-container></ng-container>
          </tb-setting-object>
        </tb-setting-section>
      </ng-container>
    </tb-setting-stack>
  </tb-collapsible-card>

  <!-- A dashboard's own cards, sharing the floating Cancel / Apply below (see extraDirty). -->
  <ng-content></ng-content>
</div>

<!-- The buttons, under the cards — only while the form (or the projected cards) has unsaved edits. -->
<tb-form-actions *ngIf="dirty || extraDirty" [submits]="false" [disabled]="saving || applyBlocked" (cancelled)="onCancel()"
                 (submitted)="onApply()"></tb-form-actions>
