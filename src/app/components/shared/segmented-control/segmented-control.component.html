<div class="seg-group" role="group" [class.seg-active-label]="showActiveLabel" [class.seg-split]="splitLabels">
  <!-- Each option's tooltip: the dashboards' bubble (tbTip — drawn over the page, never cut off by a panel or a card). -->
  <button *ngFor="let opt of options; trackBy: trackById" (click)="select(opt.id)" [class.active]="selected === opt.id"
          [class.seg-icon-btn]="opt.icon" [attr.aria-pressed]="selected === opt.id" [attr.aria-label]="opt.label"
          [tbTip]="tipOf(opt)" [tbTipPlacement]="tooltipPosition" class="seg-btn" type="button">
    <span *ngIf="opt.icon; else segLabel" class="seg-icon-wrap">
      <mat-icon>{{ opt.icon }}</mat-icon>
      <span *ngIf="opt.badge" class="seg-badge">{{ opt.badge }}</span>
    </span>
    <span *ngIf="opt.icon && showActiveLabel && (selected === opt.id || splitLabels)" class="seg-inline-label">{{ opt.label }}</span>
    <ng-template #segLabel>{{ opt.label }}</ng-template>
  </button>
</div>
