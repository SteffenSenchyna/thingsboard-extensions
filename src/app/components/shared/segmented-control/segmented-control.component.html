<div class="seg-group" role="group" [class.seg-active-label]="showActiveLabel"
     [class.seg-tip-below]="tooltipPosition === 'below'">
  <button *ngFor="let opt of options; trackBy: trackById" (click)="select(opt.id)" [class.active]="selected === opt.id"
          [class.seg-icon-btn]="opt.icon" [attr.aria-pressed]="selected === opt.id" [attr.aria-label]="opt.label"
          class="seg-btn" type="button">
    <span *ngIf="opt.icon; else segLabel" class="seg-icon-wrap">
      <mat-icon>{{ opt.icon }}</mat-icon>
      <span *ngIf="opt.badge" class="seg-badge">{{ opt.badge }}</span>
    </span>
    <span *ngIf="opt.icon && showActiveLabel && selected === opt.id" class="seg-inline-label">{{ opt.label }}</span>
    <ng-template #segLabel>{{ opt.label }}</ng-template>
    <!-- The selected option already shows its label in view-switcher mode — no tooltip there. -->
    <span *ngIf="opt.tooltip && !(showActiveLabel && selected === opt.id)" class="seg-tooltip">{{ opt.tooltip }}</span>
  </button>
</div>
