<div *ngIf="heading" class="tbfl-heading">{{ heading }}</div>
<!-- treeToggle: a tree's "Tree grouping" switch (its label, the switch at the row's end) — off, a flat list by name. -->
<tb-ext-switch *ngIf="treeToggle && hasTree" class="tbfl-tree-toggle" label="Tree grouping" [labelFirst]="true" [ngModel]="treeOn"
               (ngModelChange)="treeOn = $event"></tb-ext-switch>

<section class="tbfl-card">
  <!-- (Enter in the search never submits a form the list sits in — a user form's plants.) -->
  <label class="tbfl-search">
    <mat-icon>search</mat-icon>
    <input type="text" [(ngModel)]="search" [placeholder]="searchPlaceholder" [attr.aria-label]="searchPlaceholder" (keydown.enter)="$event.preventDefault()" />
    <button *ngIf="search" type="button" class="tbfl-search-clear" aria-label="Clear search" (click)="search = ''">
      <mat-icon>close</mat-icon>
    </button>
  </label>

  <!-- "Selected (n)" — expands to the selection as removable chips (multi-select only). -->
  <div *ngIf="multiple" class="tbfl-selected">
    <button type="button" class="tbfl-selected-toggle" [class.open]="selectedOpen"
            [attr.aria-expanded]="selectedOpen" (click)="selectedOpen = !selectedOpen">
      <span>Selected ({{ chips.length }})</span>
      <mat-icon>expand_more</mat-icon>
    </button>
    <!-- Folds open / closed with the shared expand timing; each chip pops in. -->
    <div class="tbfl-chips-wrap" [class.open]="selectedOpen && chips.length > 0"
         [attr.inert]="selectedOpen && chips.length ? null : ''">
      <div class="tbfl-chips">
        <span *ngFor="let chip of chips; trackBy: trackById" class="tbfl-chip">
          <span class="tbfl-chip-label">{{ chip.label }}</span>
          <button type="button" class="tbfl-chip-remove" [attr.aria-label]="'Remove ' + chip.label"
                  (click)="removeChip(chip)">
            <mat-icon>close</mat-icon>
          </button>
        </span>
      </div>
    </div>
  </div>

  <!-- Single-choice mode: a flat radio list. -->
  <!-- The rows (tbfl-rows: as wide as the widest — a long label scrolls the list sideways, never cut). -->
  <div *ngIf="!multiple" class="tbfl-list" role="radiogroup">
    <div class="tbfl-rows">
      <div *ngFor="let n of visibleNodes; trackBy: trackByNode" class="tbfl-option" [class.disabled]="isDisabled(n.option)" tabindex="-1" role="presentation"
           (click)="onRowClick(n.option, $event)" (keydown.enter)="onRowClick(n.option, $event)">
        <button type="button" class="tbfl-radio-row" role="radio" [attr.aria-checked]="isSelected(n.option.id)"
                [disabled]="isDisabled(n.option)" (click)="pick(n.option)">
          <span class="tbfl-radio" [class.on]="isSelected(n.option.id)"></span>
          <span class="tbfl-radio-label">{{ labelOf(n.option) }}</span>
        </button>
      </div>
    </div>
    <div *ngIf="!visibleNodes.length" class="tbfl-empty">{{ emptyText }}</div>
  </div>

  <div #list *ngIf="multiple" class="tbfl-list">
    <div class="tbfl-rows">
      <ng-container *ngFor="let n of visibleNodes; trackBy: trackByNode">
        <ng-container *ngTemplateOutlet="treeRow; context: { $implicit: n, depth: 0, last: false }"></ng-container>
      </ng-container>
    </div>
    <div *ngIf="!visibleNodes.length" class="tbfl-empty">{{ emptyText }}</div>
  </div>

  <!-- A row and, a parent's, the rows under it (any depth). The top level: a twisty folding it (a spacer on a leaf, in a tree). Under it:
       past the branch — the elbow into its box, the line on to the next sibling (not on the last), each level a step further in. -->
  <ng-template #treeRow let-n let-depth="depth" let-last="last">
    <div class="tbfl-option" [class.tbfl-child]="depth > 0" [class.tbfl-last]="depth > 0 && last" [class.disabled]="isDisabled(n.option)"
         [style.--tbfl-depth]="depth" tabindex="-1" role="presentation"
         (click)="onRowClick(n.option, $event)" (keydown.enter)="onRowClick(n.option, $event)">
      <!-- An open parent's stem down to its children (an element of its own: a nested parent's elbow is its ::after). -->
      <span *ngIf="n.expanded && n.children.length" class="tbfl-stem" aria-hidden="true"></span>
      <ng-container *ngIf="depth === 0">
        <!-- Expand/collapse for parents; a same-width spacer keeps leaves aligned in a tree. -->
        <button *ngIf="hasChildren(n.option); else spacer" type="button" class="tbfl-twisty" [class.open]="n.expanded"
                [attr.aria-expanded]="n.expanded"
                [attr.aria-label]="(n.expanded ? 'Collapse ' : 'Expand ') + n.option.label"
                (click)="toggleCollapsed(n.option.id)">
          <mat-icon>chevron_right</mat-icon>
        </button>
        <ng-template #spacer><span *ngIf="isTree" class="tbfl-twisty-spacer"></span></ng-template>
      </ng-container>
      <tb-ext-checkbox class="tbfl-check" [label]="labelOf(n.option)" [triState]="hasChildren(n.option)"
                       [ngModel]="state(n.option)" (ngModelChange)="toggle(n.option)"
                       [disabled]="isDisabled(n.option) || !leafIds(n.option).length"></tb-ext-checkbox>
    </div>
    <!-- Its children fold open / closed with the shared expand timing (kept in the DOM; inert while closed). A nested group with siblings
         after it carries its level's line on past its children (tbfl-continue). -->
    <div *ngIf="hasChildren(n.option)" class="tbfl-children" [class.open]="n.expanded" [class.tbfl-continue]="depth > 0 && !last"
         [style.--tbfl-depth]="depth" [attr.inert]="n.expanded ? null : ''">
      <div class="tbfl-children-inner">
        <ng-container *ngFor="let c of n.children; let lastChild = last; trackBy: trackByNode">
          <ng-container *ngTemplateOutlet="treeRow; context: { $implicit: c, depth: depth + 1, last: lastChild }"></ng-container>
        </ng-container>
      </div>
    </div>
  </ng-template>

  <!-- The links (multi-select only; a single-choice list ends with its rows), and at the right — while the list hides rows, or is
       open — the expand button: the list shown whole, the tree's full height. -->
  <div *ngIf="multiple" class="tbfl-footer">
    <button type="button" class="tbfl-link" (click)="selectAll()">Select all</button>
    <button type="button" class="tbfl-link" [disabled]="!selected.length" (click)="reset()">Reset</button>
    <button *ngIf="listOverflows || listOpen" type="button" class="tbfl-expand" [class.active]="listOpen" [attr.aria-pressed]="listOpen"
            [tbTip]="listOpen ? 'Collapse' : 'Expand'" [attr.aria-label]="listOpen ? 'Collapse' : 'Expand'" (click)="toggleList()">
      <mat-icon>{{ listOpen ? "unfold_less" : "unfold_more" }}</mat-icon>
    </button>
  </div>
</section>
