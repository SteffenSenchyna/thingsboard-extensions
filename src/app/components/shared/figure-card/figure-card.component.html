<!-- Its title and value, its meter, what's projected (its figures), then its muted foot line. -->
<div class="fc-head">
  <span class="fc-title">{{ title }}</span>
  <span *ngIf="note || value" class="fc-end">
    <span *ngIf="note" class="fc-note">{{ note }}</span>
    <span *ngIf="value" class="fc-value" [attr.data-tone]="tone">{{ value }}</span>
  </span>
</div>
<div *ngIf="meter !== undefined" class="fc-track">
  <div class="fc-fill" [attr.data-tone]="tone" [style.width.%]="meterWidth"></div>
</div>
<ng-content></ng-content>
<div *ngIf="foot || footEnd" class="fc-foot">
  <span>{{ foot }}</span>
  <span *ngIf="footEnd; else footSlot">{{ footEnd }}</span>
  <ng-template #footSlot><ng-content select="[figure-foot]"></ng-content></ng-template>
</div>
