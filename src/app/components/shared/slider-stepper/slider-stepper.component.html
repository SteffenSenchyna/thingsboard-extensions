<div class="ss-row" [class.ss-disabled]="disabled">
  <input type="range" class="ss-slider" [min]="min" [max]="max" [step]="step" [value]="value" [disabled]="disabled"
         [style.--ss-fill]="fillPercent" (input)="onSlider($event)" aria-label="Slider" />

  <!-- The value, its unit and the stepper chevrons: the shared number box. -->
  <tb-number-box class="ss-box" [min]="min" [max]="max" [step]="step" [unit]="unit" [ngModel]="value" (ngModelChange)="setValue($any($event))"
                 [disabled]="disabled" ariaLabel="Value"></tb-number-box>
</div>
