<!-- A device's list: its alarms, or the user's notifications for them — the picker on top (the timeframe picker's look). -->
<tb-timeframe-picker *ngIf="forDevice" [options]="views" [selected]="view" [fullWidth]="true" (selectedChange)="view = $event"></tb-timeframe-picker>

<!-- Notifications: the device's alarms, each with where the user is told of it (Google Chat, email) and at which severities. Kept mounted
     (hidden until its view): it reads as soon as the device is known, so it's there by the time the view opens. -->
<tb-alarm-subscriptions *ngIf="forDevice" [hidden]="view !== 'notifications'" [ctx]="ctx!" [deviceId]="deviceId" [notices]="notices"
                        [memberIds]="memberIds" [memberLabel]="memberLabel"></tb-alarm-subscriptions>

<ng-container *ngIf="!forDevice || view === 'alarms'">
<!-- Severity filter: four equal boxes, each a 1–4 segment bar with its name in a bubble (a click on the picked one clears it). -->
<tb-severity-boxes [selected]="severityFilter" (selectedChange)="setSeverity($event)"></tb-severity-boxes>

<ng-container *ngIf="grouped; else flat">
  <tb-data-table *ngFor="let g of groups; trackBy: trackByGroupId" [title]="g.name" [subtitle]="g.sub" [compactHeader]="true"
                 [columns]="columns" [rows]="g.rows" [showColumnHeaders]="false" [searchEnabled]="false"
                 [paginated]="false" trackByKey="id" [insetRowDivider]="true" [rowHover]="false" emptyText="No alarms">
    <ng-template tbDataTableCell="alarm" let-row>
      <ng-container *ngTemplateOutlet="alarmCell; context: { $implicit: row }"></ng-container>
    </ng-template>
  </tb-data-table>
  <!-- Empty / loading state — a single header-less card. -->
  <tb-data-table *ngIf="!groups.length" [showHeader]="false" [columns]="columns" [rows]="[]" [loading]="loading"
                 [showColumnHeaders]="false" [searchEnabled]="false" [paginated]="false" [insetRowDivider]="true"
                 [rowHover]="false" emptyText="No alarms" emptyIcon="notifications_off"
                 loadingText="Loading alarms…"></tb-data-table>
</ng-container>

<ng-template #flat>
  <tb-data-table [showHeader]="false" [columns]="columns" [rows]="filtered" [loading]="loading"
                 [showColumnHeaders]="false" [searchEnabled]="false" [paginated]="false" trackByKey="id"
                 [insetRowDivider]="true" [rowHover]="false" emptyText="No alarms" emptyIcon="notifications_off"
                 loadingText="Loading alarms…">
    <ng-template tbDataTableCell="alarm" let-row>
      <ng-container *ngTemplateOutlet="alarmCell; context: { $implicit: row }"></ng-container>
    </ng-template>
  </tb-data-table>
</ng-template>

</ng-container>

<ng-template #alarmCell let-row>
  <div class="al-cell">
    <div class="al-main">
      <div class="al-title">{{ row.type }}</div>
      <!-- Severity and time on one line — and the device, a list of several devices' (a station's PLC and pumps); a short reading
           ("20.2 °C") beside them, a long message on its own lines below. -->
      <div class="al-meta">
        <span class="al-bar" [tbTip]="severityLabel(row.severity)">
          <tb-severity-bar [severity]="row.severity"></tb-severity-bar>
        </span>
        <span class="al-time">{{ row.createdTime | date: dateFormat }}</span>
        <ng-container *ngIf="showOriginator && row.originatorName">
          <span class="al-divider"></span>
          <span class="al-data al-originator">{{ row.originatorName }}</span>
        </ng-container>
        <ng-container *ngIf="row.detailsData && !isMessage(row)">
          <span class="al-divider"></span>
          <span class="al-data">{{ row.detailsData }}</span>
        </ng-container>
      </div>
      <div *ngIf="row.detailsData && isMessage(row)" class="al-message">{{ row.detailsData }}</div>
    </div>
    <button type="button" class="al-action" [disabled]="row.cleared" [tbTip]="row.cleared ? 'Cleared' : 'Clear'"
            aria-label="Clear alarm" (click)="onClear(row)">
      <mat-icon>clear</mat-icon>
    </button>
  </div>
</ng-template>
