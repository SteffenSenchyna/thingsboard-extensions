<!-- Its access token (masked — reveal and copy in the box), Regenerate, then Save; other credentials: named, edited in ThingsBoard. -->
<div class="dc">
  <tb-card>
    <div class="dc-fields">
      <div *ngIf="loading" class="dc-hint">Loading credentials…</div>
      <ng-container *ngIf="!loading && credentials">
        <div class="dc-field">
          <span class="dc-label">Type</span>
          <span class="dc-value">{{ typeName }}</span>
        </div>
        <div *ngIf="isToken" class="dc-field">
          <label class="dc-label" for="dc-token">Access token</label>
          <tb-secret-box inputId="dc-token" ariaLabel="Access token" placeholder="Access token" [invalid]="token.invalid && token.dirty"
                         [formControl]="token"></tb-secret-box>
          <span class="dc-hint">The device posts with it (MQTT username, HTTP / CoAP path). A new one takes over once saved.</span>
        </div>
        <span *ngIf="!isToken" class="dc-hint">Credentials of this kind are edited on the device's page in ThingsBoard.</span>
      </ng-container>
      <span *ngIf="!loading && !credentials" class="dc-hint dc-error">Couldn't read the device's credentials.</span>
    </div>
    <div *ngIf="isToken" class="dc-actions">
      <button type="button" class="dc-regenerate" [disabled]="saving" (click)="regenerate()">Regenerate</button>
      <span class="dc-spacer"></span>
      <ng-container *ngIf="token.dirty">
        <button type="button" class="dc-cancel" (click)="discard()">Cancel</button>
        <button type="button" class="dc-submit" [disabled]="token.invalid || saving" (click)="save()">{{ saving ? "Saving…" : "Save token" }}</button>
      </ng-container>
    </div>
  </tb-card>
</div>
